<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Completed</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 22px 36px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
  }
  .completion-card {
    width: min(860px, 100%);
    margin: 0 auto;
    padding: 56px 28px 52px;
    text-align: center;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  h1 {
    margin: 0 0 30px;
    font-size: 36px;
    line-height: 1.2;
  }
  p {
    margin: 16px 0;
    font-size: 18px;
    line-height: 1.55;
  }
  .cn { margin-top: 18px; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    .completion-card { padding: 42px 20px; }
    h1 { font-size: 30px; }
    p { font-size: 17px; }
  }
</style>
</head>
<body>
  <main class="completion-card">
    <h1>Study Completed</h1>
    <p>You have completed all writing tasks and questionnaires.</p>
    <p class="cn">研究任务及问卷已全部完成。感谢你的参与。</p>
  </main>
</body>
</html>
